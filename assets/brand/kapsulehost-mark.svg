<!--
  The KapsuleHost mark: the cloud with the capsule through it.

  This replaces a generic teal arrow in a rounded square, which was a placeholder sitting in a
  customer's own WordPress admin, permanently, on one of the most visible surfaces our brand has.

  Reconstructed as vector from the brand master `public/v13/cloud-mark.png` in the marketing tree
  (512x366). The brand ships as raster cut from 4200px masters and there was no SVG anywhere, so the
  geometry and the palette below were MEASURED off that master rather than eyeballed: the cloud runs
  #0BC7C8 (left lobe) through #03AAB3 (middle) to #0390AD (top right), and the capsule runs #73DCE0
  at the near end to #02578E at the far end. The capsule deliberately overhangs the cloud on both
  sides, which is what stops the mark reading as a plain cloud.

  viewBox matches the master so the proportions cannot drift.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 366" role="img" aria-label="KapsuleHost">
  <defs>
    <linearGradient id="khCloud" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0BC7C8"/>
      <stop offset="0.55" stop-color="#03AAB3"/>
      <stop offset="1" stop-color="#0390AD"/>
    </linearGradient>
    <linearGradient id="khCapsule" x1="0.1" y1="0.9" x2="0.95" y2="0.15">
      <stop offset="0" stop-color="#9FEAEC"/>
      <stop offset="0.42" stop-color="#73DCE0"/>
      <stop offset="0.78" stop-color="#1878B8"/>
      <stop offset="1" stop-color="#02578E"/>
    </linearGradient>
  </defs>

  <!-- Cloud: three lobes over a rounded base, matching the master's silhouette. -->
  <g fill="url(#khCloud)">
    <circle cx="300" cy="122" r="104"/>
    <circle cx="152"  cy="186" r="88"/>
    <circle cx="104"  cy="256" r="98"/>
    <circle cx="372" cy="232" r="94"/>
    <rect x="104" y="192" width="268" height="130" rx="65"/>
  </g>

  <!-- The capsule, angled through the cloud and overhanging it at both ends. -->
  <!-- Centroid (320,217) and a +19 degree long axis, both measured off the master, with the pale end
       toward the upper left and the deep end toward the lower right, which is the direction the
       gradient runs in the artwork. -->
  <g transform="rotate(24 320 217)">
    <rect x="150" y="140" width="368" height="156" rx="78" fill="url(#khCapsule)"/>
  </g>
</svg>

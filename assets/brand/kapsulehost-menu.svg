<!--
  THE KAPSULEHOST MARK FOR THE WORDPRESS ADMIN MENU. NOT DRAWN BY HAND.

  What was here before was a hand-authored approximation: a flat cyan cloud with a flat navy bar
  laid across it, two colours picked by eye. It rendered, so nothing flagged it, and it was still
  not our mark. The real KapsuleHost icon is a teal cloud with a pale gradient capsule lying across
  it whose far end turns deep blue, and none of that survives being redrawn from memory. The brand
  README is explicit that the artwork has ONE source and that no surface ships its own copy of it:
  brand/masters/kapsule-icon.png in the portal repo. This file now carries that artwork itself.

  WHY THE PIXELS SIT INSIDE AN SVG RATHER THAN BEING LINKED AS A PNG. WordPress only gives a menu
  icon the background-image treatment when the value passed to add_menu_page() starts with the
  literal "data:image/svg+xml;base64," (wp-admin/menu-header.php). Anything else is emitted as an
  img element, and "#adminmenu .wp-menu-image img" in wp-admin/css/admin-menu.css sets opacity 0.6,
  which washes a colour logo out on every scheme. The background-image path carries no such rule:
  "#adminmenu div.wp-menu-image.svg" sets only no-repeat, centre, and background-size 20px auto.
  So the wrapper has to be an SVG, and the real artwork rides inside it.

  DO NOT REINTRODUCE currentColor HERE. A menu icon is painted as a BACKGROUND IMAGE, which inherits
  no colour from the page, so currentColor resolves to nothing and the icon disappears. That is what
  the original placeholder arrow did. Whatever colours are in this file are the colours the customer
  sees, which is why it carries the full-colour mark and not a tintable silhouette.

  REGENERATE (from the portal worktree, never by editing the base64 by hand):
    sharp('brand/masters/kapsule-icon.png').trim().resize({ width: 60 })
      .png({ compressionLevel: 9, palette: true, effort: 10 })
  Source master sha256 (first 16 chars): e36c466a1cc31baa
  Embedded raster: 60x43, three times the 20px WordPress renders it at.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="43" viewBox="0 0 60 43" role="img" aria-label="KapsuleHost">
  <image href="data:image/png;base64," width="60" height="43"/>
</svg>
